# Canonical source for local Postgres dev credentials. If you change these,
# also update (they can't read this file automatically): .env.example,
# packages/database/.env.example, and the `env`/`services.postgres.env`
# blocks in .github/workflows/ci.yml. The `us_os_app` role and its password
# are created separately by a migration (see
# packages/database/prisma/migrations/*_add_restricted_app_role) and must be
# kept in sync the same way.
services:
  postgres:
    image: postgres:16-alpine
    container_name: us-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: us_os
      POSTGRES_PASSWORD: us_os_dev_password
      POSTGRES_DB: us_os_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U us_os -d us_os_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: us-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
