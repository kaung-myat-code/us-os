# .github/workflows/ci.yml
# Main CI pipeline: Lint, Type Check, Test, Build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Enforce least-privilege permissions
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Credentials below must match docker-compose.yml (the canonical source for
    # local dev) and .env.example / packages/database/.env.example. GitHub
    # Actions service containers can't read those files at job setup, so these
    # have to stay literal here — keep them in sync by hand.
    env:
      # us_os is a superuser bootstrap role, reserved for `prisma migrate`/`generate`.
      # us_os_app is a non-superuser, NOBYPASSRLS role the app/tests connect as, so
      # RLS policies are actually enforced (see packages/database/.env.example).
      DATABASE_URL: "postgresql://us_os:us_os_dev_password@localhost:5432/us_os_dev?schema=public"
      APP_DATABASE_URL: "postgresql://us_os_app:us_os_app_dev_password@localhost:5432/us_os_dev?schema=public"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: us_os
          POSTGRES_PASSWORD: us_os_dev_password
          POSTGRES_DB: us_os_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U us_os -d us_os_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @us-os/database db:generate

      - name: Apply database migrations
        run: pnpm --filter @us-os/database exec prisma migrate deploy

      - name: Run linter
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build
